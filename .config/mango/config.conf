# QT_SCALE_FACTOR: the bar and panels 25% bigger (the screen itself isn't scaled)
exec_once=QT_SCALE_FACTOR=1.25 quickshell -p ~/.config/quickshell >/dev/null 2>&1 &
# kitty's shared process (~/.local/bin/kitty): new terminals open in it at once
exec_once=/usr/bin/kitty -1 --start-as=hidden
exec_once=~/.config/mango/scripts/mm track
# a window asking for attention comes to the tag you're on (with focus_on_activate=0 below it's only marked urgent)
exec_once=~/.config/mango/scripts/mm attention
exec_once=~/.local/bin/settimes --apply
exec_once=~/.local/bin/wallpaper warm
exec_once=wl-paste --type text --watch ~/.config/mango/scripts/clean-links
# every other monitor scaled so things look the same size as on this laptop (by its real size in mm, see the script);
# the laptop itself stays at 1: quickshell and kitty are sized up themselves
exec_once=~/.config/mango/scripts/autoscale
exec_once=~/.local/bin/night-mode --login

repeat_rate=90
repeat_delay=180
numlock_on=1
xkb_rules_layout=gb

trackpad_accel_speed=0.2
mouse_accel_speed=0.2
# scroll direction: 1 natural (the page follows your fingers, like a phone), 0 traditional
trackpad_natural_scrolling=1
mouse_natural_scrolling=0
# no window overview: not from a screen corner either
enable_hotarea=0

source_optional=~/.cache/wal/colors.conf

blur=1
blur_params_radius=4
blur_optimized=1

layer_animations=1

animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

animation_fade_in=0
animation_fade_out=0

animation_duration_move=400
animation_duration_open=300
animation_duration_close=200

gap_inner_vertical=1
gap_inner_horizontal=2
gap_outer_vertical=2
gap_outer_horizontal=1
border_px=3
border_radius=2

default_master_factor=0.58
cursor_hide_timeout=1
# focus follows the mouse; the cursor jumps to a window focused from the keyboard; a tiled window dragged onto another
# swaps with it (written out so a change in mango's defaults can't drop them)
sloppy_focus=1
warp_cursor=1
drag_tile_to_tile=1
axis_bind_apply_timeout=30
# apps asking for attention don't take you to their tag: mm attention brings them here instead
focus_on_activate=0

allow_tearing=1

layer_rule=no_animation:1,layer_name:quickshell
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:1344,height:756,app_id:kp
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:896,height:420,app_id:clicker
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:720,height:120,app_id:mpv-audio
# is_tag_silent too: kitty asks for focus as it opens, which would otherwise bring it to the tag you're on
window_rule=tags:9,is_open_silent:1,is_tag_silent:1,app_id:vpn
# pictures open straight in the middle, without sliding in from the edge first
window_rule=no_animation:1,app_id:swayimg
window_rule=is_floating:1,animation_type_open:none,animation_type_close:none,width:1008,height:280,app_id:passprompt

bind=ALT,r,reload_config
bind=SUPER,q,spawn,~/.config/mango/scripts/close
# toggles run once per press (a held key repeats)
bind=SUPER,BackSpace,spawn,~/.config/mango/scripts/once powermenu qs ipc call powermenu toggle

bind=SUPER,d,spawn,~/.config/mango/scripts/once applauncher qs ipc call applauncher toggle
bind=SUPER,grave,spawn,~/.config/mango/scripts/once emoji qs ipc call emojipicker toggle
bind=SUPER+SHIFT,p,spawn,~/.config/mango/scripts/once screenshot qs ipc call screenshotter toggle
bind=SUPER,apostrophe,spawn,~/.config/mango/scripts/once calc qs ipc call calc toggle
bind=SUPER,F3,spawn,~/.config/mango/scripts/once timezone qs ipc call timezone toggle
bind=SUPER,c,spawn,~/.config/mango/scripts/once calendar qs ipc call calendar toggle
bind=SUPER+SHIFT,n,spawn,~/.config/mango/scripts/once notifications qs ipc call notifications toggle
bind=SUPER+SHIFT,s,spawn,~/.config/mango/scripts/once wallpapers qs ipc call wallpaperSelector toggle
bind=CTRL+ALT,l,spawn,qs ipc call lockscreen lock
# the newest notification pop-up away
bind=ALT,BackSpace,spawn,qs ipc call notifications dismiss

bind=SUPER,Return,spawn,kitty
bind=SUPER,w,spawn,~/.local/bin/glide-bin
bind=SUPER,r,spawn,kitty yazi
# Super+f: as big as the screen with the bar still showing; Super+Alt+f: real fullscreen
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+ALT,f,togglefullscreen,
bind=SUPER+SHIFT,r,spawn,kitty btop
bind=SUPER,F4,spawn,kitty wiremix
# the wifi menu (a click on the network in the bar too)
bind=SUPER,F5,spawn,qs ipc call wifi toggle
bind=SUPER+SHIFT,d,spawn,~/.config/mango/scripts/once kp ~/.local/bin/kp toggle
bind=SUPER,s,spawn,flatpak run chat.simplex.simplex
# virtual machines: the VM's window; pressed again with it open, powers the VM on too (scripts/vm)
bind=SUPER,v,spawn,virt-manager
bind=SUPER,p,spawn,~/.config/mango/scripts/vm publicarchlinux
bind=SUPER,a,spawn,~/.config/mango/scripts/vm archlinux
bind=SUPER,n,spawn,~/.config/mango/scripts/vm Whonix-Gateway
bind=SUPER+SHIFT,w,spawn,~/.config/mango/scripts/vm Whonix-Workstation
# pasting (the key still reaches the app): brings kp back if it hid itself after a copy
bindp=CTRL,v,spawn,~/.local/bin/kp --pasted
bindp=CTRL+SHIFT,v,spawn,~/.local/bin/kp --pasted
bindp=SHIFT,Insert,spawn,~/.local/bin/kp --pasted

bind=SUPER,b,spawn,~/.local/bin/wallpaper
# VPN on (its terminal goes to tag 9; you stay where you are) / off
bind=SUPER+ALT,u,spawn,~/.config/mango/scripts/once vpn ~/.local/bin/vpn
bind=SUPER,F1,spawn,~/.config/mango/scripts/once rec ~/.local/bin/record-screen
bind=SUPER+SHIFT,F1,spawn,~/.config/mango/scripts/once rec ~/.local/bin/record-screen -r
bind=SUPER,F2,spawn,~/.config/mango/scripts/once recp ~/.local/bin/record-screen -p
bind=SUPER,F6,spawn,~/.config/mango/scripts/once clicker ~/.local/bin/clicker
bind=SUPER+SHIFT,F6,spawn,~/.config/mango/scripts/once clickers ~/.local/bin/clicker speed
bind=SUPER,F10,spawn,~/.config/mango/scripts/once clickrec ~/.local/bin/clicker record
bind=SUPER,F11,spawn,~/.config/mango/scripts/once clickpick ~/.local/bin/clicker pick
bind=SUPER+SHIFT,F11,spawn,~/.config/mango/scripts/once clickplay ~/.local/bin/clicker play

# Super+j / k: with the calculator open it's one of the windows they step through (mm step)
# window keys go through calc-or: with the calculator open and holding the keyboard it moves like a window
bind=SUPER,j,spawn,~/.config/mango/scripts/mm step next
bind=SUPER,k,spawn,~/.config/mango/scripts/mm step prev
bind=SUPER+SHIFT,h,spawn,~/.config/mango/scripts/calc-or shift-h exchange_client,left
bind=SUPER+SHIFT,j,spawn,~/.config/mango/scripts/calc-or shift-j exchange_client,down
bind=SUPER+SHIFT,k,spawn,~/.config/mango/scripts/calc-or shift-k exchange_client,up
bind=SUPER+SHIFT,l,spawn,~/.config/mango/scripts/calc-or shift-l exchange_client,right
bind=SUPER,l,spawn,~/.config/mango/scripts/mm resize +50 +0
bind=SUPER,h,spawn,~/.config/mango/scripts/mm resize -50 +0
bind=SUPER,space,spawn,~/.config/mango/scripts/calc-or space zoom
bind=SUPER,t,setlayout,tile
bind=SUPER,u,setlayout,vertical_scroller
bind=SUPER+SHIFT,t,setlayout,vertical_tile
bind=SUPER+SHIFT,v,setlayout,tgmix
bind=SUPER+SHIFT,c,setlayout,grid
bind=SUPER,i,incnmaster,+1
bind=SUPER,o,incnmaster,-1
bind=SUPER+SHIFT,a,togglegaps
bind=SUPER,x,incgaps, -3
bind=SUPER,z,incgaps, +3

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER,0,toggleoverview
bind=SUPER,Tab,spawn,~/.config/mango/scripts/once lasttag ~/.config/mango/scripts/mm lasttag
bind=SUPER,g,viewtoleft
bind=SUPER,semicolon,viewtoright
bind=SUPER+SHIFT,g,tagtoleft
bind=SUPER+SHIFT,semicolon,tagtoright
# Super+scroll: the tag to the left / right that has windows
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +10%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bind=SUPER,Up,spawn,brightnessctl s +10%+
bind=SUPER,Down,spawn,brightnessctl s 10%-
bind=SUPER,Right,spawn,~/.local/bin/night-mode up
bind=SUPER,Left,spawn,~/.local/bin/night-mode down

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,~/.config/mango/scripts/once mute wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioPlay,spawn,~/.config/mango/scripts/once pause-all ~/.config/mango/scripts/pause-all
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=SUPER,period,spawn,wpctl set-volume -l 1.5 @DEFAULT_SINK@ 5%+
bind=SUPER,comma,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=SUPER,m,spawn,~/.config/mango/scripts/once mute wpctl set-mute @DEFAULT_SINK@ toggle
bind=SUPER,equal,spawn,~/.config/mango/scripts/opacity up
bind=SUPER+SHIFT,plus,spawn,~/.config/mango/scripts/opacity up
bind=SUPER,minus,spawn,~/.config/mango/scripts/opacity reset
bind=SUPER+SHIFT,m,spawn,~/.config/mango/scripts/once pause-all ~/.config/mango/scripts/pause-all
