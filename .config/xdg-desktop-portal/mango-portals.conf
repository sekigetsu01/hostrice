# Which portal backend handles what under MangoWM (it sets
# XDG_CURRENT_DESKTOP=mango, so this file is used over portals.conf and over
# Mango's own /usr/share/xdg-desktop-portal/mango-portals.conf).
# Same as Mango's default, plus yazi as the file picker.
#
# After editing: systemctl --user restart xdg-desktop-portal
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=termfilechooser
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none
