# kitty, the terminal: wallpaper colours, see-through, padding, cursor, icons and keys.
# Pictures in notes are drawn as part of the text.

# Terminess: the Terminus letters, made for kitty (it can't use bitmap Terminus: sudo pacman -S ttf-terminus-nerd)
font_family Terminess Nerd Font Mono
# 14 px letters in 8 x 14 cells: Terminess at 10.5 gives 14 px letters in 8 x 16 cells, so its lines are
# brought down to 14
font_size 15
modify_font cell_height -2px
# ...and its letters one pixel up, so accents (É) and tails (g y q p j) fit those 14 rows
modify_font baseline 1
disable_ligatures always
# never italics: text an app asks to be italic is drawn upright (bold italic as bold)
italic_font      family="Terminess Nerd Font Mono" style=Regular
bold_italic_font family="Terminess Nerd Font Mono" style=Bold
# icons from Hack Nerd Font (full-size, spilling into the next cell); Terminess Mono's own icons are squeezed into
# one narrow cell
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+23FB-U+23FE,U+2665,U+26A1,U+2B58 Hack Nerd Font

# the wallpaper's colours (pywal writes this file on every wallpaper change; ~/.config/wal/postrun then gives
# them to open windows and to the shared kitty for new ones)
include ~/.cache/wal/kitty-colors.conf
# see-through (0.8); SUPER+= / SUPER+- switch it for every terminal (~/.config/mango/scripts/opacity
# writes the choice to ~/.cache/kitty-opacity.conf for new windows and changes open ones over the remote-control socket)
background_opacity 0.8
dynamic_background_opacity yes
include ~/.cache/kitty-opacity.conf
# at most ~30 redraws a second (default 100): far less drawing in software; what you type still shows at once
repaint_delay 16

window_padding_width 6
placement_strategy top-left
hide_window_decorations yes
tab_bar_style hidden
confirm_os_window_close 0
enable_audio_bell no
linux_display_server wayland
# draw without waiting for mango's "frame shown" signal: in software (this VM has no graphics acceleration) those
# often don't come, and the window then stays empty (kitty --debug-rendering: "No render frame received")
sync_to_monitor no

cursor_shape beam
cursor_blink_interval 0
cursor_trail 0

scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 5.0

# selecting copies
copy_on_select clipboard
strip_trailing_spaces smart

open_url_with /home/user/.local/bin/open-link
url_style straight

# scripts can reach open windows through this (kitty @)
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty
shell_integration enabled

# keys
map alt+k scroll_line_up
map alt+j scroll_line_down
map alt+u remote_control scroll-window 0.5p-
map alt+d remote_control scroll-window 0.5p
map alt+c copy_or_noop
map alt+v paste_from_clipboard
# in Neovim (it sets in_editor) Alt+v goes to Neovim, which pastes a picture when the clipboard holds one
map --when-focus-on var:in_editor alt+v
map alt+shift+k change_font_size current +1.0
map alt+shift+j change_font_size current -1.0
map ctrl+kp_add change_font_size current +1.0
map ctrl+kp_subtract change_font_size current -1.0
map alt+o open_url_with_hints
map ctrl+shift+o open_url_with_hints
map alt+shift+o kitten hints --type url --program @
map alt+shift+c launch --stdin-source=@last_cmd_output --type=background wl-copy
map alt+enter launch --type=os-window --cwd=current
map ctrl+shift+n launch --type=os-window --cwd=current
