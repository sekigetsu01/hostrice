# GTK and virt-manager settings, loaded into dconf by sys-setup (dconf load /) whenever this file changes. What you
# change in the apps themselves stays, until this file changes again.

# dark GTK apps (virt-manager, Disks…)
[org/gnome/desktop/interface]
color-scheme='prefer-dark'
gtk-theme='Adwaita-dark'

# no GNOME screen locking or blanking (the shell's lock screen does that)
[org/gnome/desktop/lockdown]
disable-lock-screen=true

[org/gnome/desktop/screensaver]
idle-activation-enabled=false

[org/gnome/desktop/session]
idle-delay=uint32 0

# the GTK file chooser (in apps that don't use the yazi picker, like virt-manager)
[org/gtk/settings/file-chooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
show-size-column=true
show-type-column=true
sort-column='name'
sort-directories-first=false
sort-order='ascending'
type-format='category'

[org/gtk/gtk4/settings/file-chooser]
show-hidden=false
sort-directories-first=false

# virt-manager: connected to the system's VMs straight away, and no extra questions
[org/virt-manager/virt-manager/connections]
autoconnect=['qemu:///system']
uris=['qemu:///system']

[org/virt-manager/virt-manager/confirm]
delete-storage=false
forcepoweroff=false
unapplied-dev=true

[org/virt-manager/virt-manager/details]
show-toolbar=true

[org/virt-manager/virt-manager/vmlist-fields]
disk-usage=false
network-traffic=false
