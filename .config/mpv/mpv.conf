# Software output: this machine's virtual GPU has no working acceleration
vo=wlshm
sws-scaler=fast-bilinear
keep-open=yes
ytdl-format=bv*[height<=1080]+ba/b
ytdl-raw-options-append=sub-langs=en.*
ytdl-raw-options-append=write-auto-subs=
# a video opened from a playlist brings the whole playlist (Tab lists it), starting at that video
ytdl-raw-options-append=yes-playlist=
slang=en,eng
alang=en,eng
osd-font="JetBrains Mono"
sub-font="JetBrains Mono"
input-ipc-server=~/.cache/mpv-socket
include="~/.cache/wal/mpv-colors.conf"

# A video in a folder plays the folder from there on, by name (only that folder, not its subfolders); a video left
# partway carries on where you stopped (just the place, not volume or speed). scripts/playlist.lua: Tab lists them
autocreate-playlist=same
directory-mode=ignore
watch-later-options=start
