l seek 20
h seek -20
j seek -60
k seek 60
S cycle sub
o add speed -0.25
p add speed 0.25
# chapters as a panel down the right, like Tab's playlist (scripts/playlist.lua)
c script-binding playlist/chapters
~ add chapter 1
@ add chapter -1
x add video-zoom -0.25
z add video-zoom 0.25
# q doesn't close the player (Super+q closes windows)
q ignore
Q ignore
